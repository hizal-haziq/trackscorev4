<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" role="img" aria-label="MIROS - Malaysian Institute of Road Safety Research">
  <defs>
    <!-- Official MIROS Yellow-Orange Gradients -->
    <linearGradient id="mirosOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="60%" stop-color="#F58220" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="mirosGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
  </defs>

  <!-- Graphic Emblem (Dynamic Road Curve / Shield / Safety Ribbon Motif) -->
  <g transform="translate(6, 6)">
    <!-- Back Glow Base -->
    <circle cx="34" cy="34" r="32" fill="#F58220" opacity="0.1" />
    
    <!-- Outer Dynamic Arc (Roadway horizon arc) -->
    <path d="M 12,50 C 8,36 14,18 28,10 C 42,2 56,8 60,18 C 55,14 44,11 32,16 C 20,21 15,34 19,46 Z" fill="url(#mirosOrangeGrad)" />
    
    <!-- Main Center Sweeping Ribbon (The dynamic Highway M Curve) -->
    <path d="M 18,58 C 24,42 34,22 45,15 C 49,12 55,12 57,17 C 59,22 55,30 46,38 C 36,47 28,54 22,59 Z" fill="url(#mirosGlowGrad)" />
    
    <!-- Inner Speed Line / Road Divider (Road lane perspective) -->
    <path d="M 28,58 C 34,48 42,36 50,30 C 53,28 56,29 55,33 C 51,40 42,50 34,58 Z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Foundation Road Base Curve -->
    <path d="M 10,54 C 18,58 32,62 46,59 C 54,57 60,53 62,48 C 60,54 52,60 42,62 C 28,64 16,60 10,54 Z" fill="url(#mirosOrangeGrad)" />
    
    <!-- Central Safety Focus Core -->
    <circle cx="48" cy="22" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Institutional MIROS Brand Wordmark (Crisp Dark Text for Light Theme) -->
  <!-- "MIROS" Main Letters -->
  <text x="86" y="47" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="36" 
        font-weight="900" 
        letter-spacing="2.5" 
        fill="#0F172A">MIROS</text>

  <!-- Official Government Agency Subtitle -->
  <text x="88" y="63" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="8.8" 
        font-weight="700" 
        letter-spacing="1.2" 
        fill="#D97706">MALAYSIAN INSTITUTE OF ROAD SAFETY RESEARCH</text>

  <!-- Secondary Malay Official Subtitle -->
  <text x="88" y="73" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="7.5" 
        font-weight="600" 
        letter-spacing="0.8" 
        fill="#64748B">INSTITUT PENYELIDIKAN KESELAMATAN JALAN RAYA MALAYSIA</text>
</svg>
